<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>阿發｜Streaming 顯示方式對照</title>
<link rel="stylesheet" href="app.css">
<style>
/* Comparison wrapper only. Chat components below reuse dist/app.css unmodified. */
html,body{min-width:320px;min-height:100%;}
body{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:12px;padding:18px 12px 28px;background:#f6f6f8;}
.compare-bar{width:min(393px,100%);display:flex;gap:7px;align-items:stretch;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC",sans-serif;}
.compare-choice{flex:1;min-width:0;padding:10px 8px;border:1px solid #dddde9;border-radius:11px;background:#fff;color:#3a3a3a;text-align:center;cursor:pointer;font-size:12px;line-height:18px;}
.compare-choice[aria-pressed=true]{border-color:#4f44c3;background:#f5f3ff;color:#4f44c3;font-weight:600;box-shadow:inset 0 0 0 1px #4f44c3;}
.compare-replay{flex:none;padding:0 13px;border:1px solid #dddde9;border-radius:11px;background:white;color:#4f44c3;font-size:13px;cursor:pointer;}
.compare-status{width:min(393px,100%);font-size:12px;color:#777;display:flex;align-items:center;justify-content:space-between;min-height:18px;}
.compare-status strong{color:#4f44c3;font-weight:500;}
.app{max-width:100%;}
/* Figma: Next-Chatbot Library > Message/Loading (32124:18914) */
.message-loading{display:flex;gap:1px;align-items:flex-start;padding:0 16px;flex:none;}
.message-loading-content{display:flex;width:325px;max-width:calc(100% - 33px);min-width:0;align-items:flex-start;padding:3px 10px 10px;}
.message-loading-bubble{display:flex;gap:10px;align-items:center;justify-content:center;min-height:46px;max-width:305px;padding:12px 16px;border:1px solid rgb(224 224 224 / 8%);border-radius:10px;background:linear-gradient(133.77deg,#fff 8.1421%,rgb(255 255 255 / 50%) 95.691%);box-shadow:0 2px 9px rgb(27 31 68 / 8%);-webkit-backdrop-filter:blur(27.5px);backdrop-filter:blur(27.5px);font-size:16px;font-weight:400;line-height:22px;letter-spacing:.3px;white-space:nowrap;}
.message-loading-star{display:block;width:20px;height:20px;object-fit:contain;}
.stream-caret{display:inline-block;width:2px;height:16px;background:#4f44c3;vertical-align:-3px;margin-left:2px;animation:blink .8s step-end infinite;}
@keyframes blink{50%{opacity:0;}}
@media(max-width:440px){body{padding:10px 0 22px;gap:8px}.compare-bar,.compare-status{width:calc(100% - 18px)}.app{border-radius:0}.compare-choice{padding:10px 4px;font-size:11px}}
@media(prefers-reduced-motion:reduce){.stream-caret{animation:none;}}
</style>
</head>
<body>
<div class="compare-bar" aria-label="選擇顯示模式">
<button type="button" class="compare-choice" data-mode="card-first" aria-pressed="true">① 卡片立即顯示<br>10 秒後文字 Streaming</button>
<button type="button" class="compare-choice" data-mode="wait-all" aria-pressed="false">② 思考中 10 秒<br>文字＋卡片一次出現</button>
<button type="button" class="compare-replay" id="replay" aria-label="重新播放">↻ 重播</button>
</div>
<div class="compare-status" role="status" aria-live="polite"><span>iPhone 393 × 852</span><strong id="status">準備開始</strong></div>
<main class="app is-chat" aria-label="國泰產險智能助理阿發">
  <div class="system-glow" aria-hidden="true"><img src="assets/system-bg.svg" alt=""></div>
  <div class="phone-chrome" aria-hidden="true"><img src="assets/ios-safari-chrome.svg" alt=""></div>
  <header class="top"><div class="brand-row"><p class="brand-name">國泰產險智能助理阿發</p><span class="beta">Beta</span></div></header>
  <section class="chat-screen" id="chat-screen" aria-label="班機延誤諮詢對話" aria-live="polite"></section>
  <footer class="composer">
    <form class="composer-form" onsubmit="return false">
      <div class="message-field"><img class="field-art" src="assets/input-field.svg" alt=""><input class="message-input" type="text" placeholder="告訴我你想做什麼" disabled aria-label="告訴我你想做什麼"></div>
      <button class="send-button" type="button" aria-label="傳送" disabled><img src="assets/send.svg" alt=""></button>
    </form>
    <p class="message-note">當您傳送訊息，即表示同意「AI告知聲明」。本服務由AI提供，<br>內容僅供參考，實際資訊仍以國泰產險官網公告為準。</p>
  </footer>
</main>
<script>
(() => {
  'use strict';
  const $ = sel => document.querySelector(sel);
  const chat = $('#chat-screen');
  const status = $('#status');
  const modeButtons = Array.from(document.querySelectorAll('[data-mode]'));
  const WAIT_MS = 10000;
  const STEP_MS = 28;
  let mode = 'card-first';
  let generation = 0;
  let timers = [];
  function el(tag, cls, text) {
    const node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text != null) node.textContent = text;
    return node;
  }
  function scroll() { requestAnimationFrame(() => { chat.scrollTop = chat.scrollHeight; }); }
  function schedule(fn,delay,token) { const id = setTimeout(() => { if(token===generation) fn(); },delay);timers.push(id); }
  function avatar() {
    const node=el('div','assistant-avatar');
    node.setAttribute('role','img');node.setAttribute('aria-label','阿發');node.dataset.component='img/Alpha/32x32';
    const face=el('img','mascot-face');face.src='assets/mascot-face.png';face.alt='';node.append(face);
    const pos=el('span','avatar-star-position'),ins=el('span','avatar-star-inset'),star=el('img','mascot-star');
    star.src='assets/mascot-star.svg';star.alt='';ins.append(star);pos.append(ins);node.append(pos);return node;
  }
  function userMessage() {
    const row=el('div','chat-user-row'),bubble=el('div','chat-user-bubble','我想申請班機延誤理賠'),time=el('p','chat-time','10:07 PM 送出');
    row.append(bubble,time);chat.append(row);
  }
  function assistantRow() {
    const row=el('div','assistant-row'),column=el('div','assistant-content');
    const meta=el('div','chat-meta');meta.append(el('p','chat-time','10:07 PM 送出'));
    row.append(avatar(),column);chat.append(row);return {column,meta};
  }
  // Same structure and Chinese copy as dist/app.js appendClaimDetails().
  function details() {
    const bubble=el('div','assistant-bubble claim-details-bubble');
    const body=el('div');body.append(el('p','claim-card-heading','班機延誤理賠注意事項'));
    const list=el('ol'),applicable=el('li');
    applicable.append('本服務僅適用班機延誤後仍搭乘原航班。以下情況請改由產險官網或線下通路辦理：');
    const subs=el('ol');subs.type='a';
    ['班機取消/改搭其他班機','錯過轉機航班','同時申請其他理賠項目'].forEach(s=>subs.append(el('li',null,s)));
    applicable.append(subs);list.append(applicable);
    ['限個人件，且要保人與被保險人須為同一人','須為班機延誤發生後二年內提出','須為國泰產險會員'].forEach(s=>list.append(el('li',null,s)));
    body.append(list);bubble.append(body);return {bubble,body};
  }
  function card() {
    const wrapper=el('div','assistant-card info-confirm-card'),heading=el('p','prep-title','申請前請準備：'),list=el('ol','prep-list');
    list.type='a';['登機證','本人匯款帳戶','班機延誤證明（視情況）'].forEach(s=>list.append(el('li',null,s)));
    const actions=el('div','info-confirm-actions');
    [['確認申請','claim-confirm'],['加入國泰產險會員','claim-register'],['前往國泰產險官網','claim-website']].forEach(([label,action])=>{
      const btn=el('button','chat-action',label);btn.type='button';btn.dataset.chatAction=action;
      btn.addEventListener('click',()=>{const message=wrapper.querySelector('[data-test-feedback]')||el('p','');message.dataset.testFeedback='true';message.style.cssText='margin:7px 14px 9px;color:#4f44c3;font-size:12px';message.textContent=`已選取「${label}」（僅供展示）`;wrapper.append(message);scroll();});actions.append(btn);
    });
    wrapper.append(heading,list,actions);return wrapper;
  }
  function loading() {
    const row=el('div','message-loading');row.dataset.component='Message/Loading';row.dataset.nodeId='32124:18914';
    const content=el('div','message-loading-content'),bubble=el('div','message-loading-bubble');
    const star=el('img','message-loading-star');star.src='assets/loading-star.svg';star.alt='';
    bubble.append(star,el('span',null,'思考中'));content.append(bubble);row.append(avatar(),content);return row;
  }
  function streamDetails(node,token) {
    // Keep the original list/card DOM and progressively reveal its text nodes.
    const {bubble,body}=details();node.column.append(bubble,node.meta);
    const walk=document.createTreeWalker(body,NodeFilter.SHOW_TEXT);
    const chunks=[];let n;while((n=walk.nextNode())){if(n.nodeValue){chunks.push({node:n,value:n.nodeValue});n.nodeValue='';}}
    const characters=[];for(const chunk of chunks){for(const c of Array.from(chunk.value)){characters.push([chunk.node,c]);}}
    let i=0;status.textContent='文字 Streaming 中';scroll();
    const run=()=>{
      if(token!==generation)return;
      for(let k=0;k<2&&i<characters.length;k++,i++){const [part,c]=characters[i];part.nodeValue+=c;}
      if(i<characters.length){schedule(run,STEP_MS,token);}else{status.textContent='播放完成';}
      scroll();
    };
    run();
  }
  function start() {
    generation++;const token=generation;
    timers.forEach(clearTimeout);timers=[];chat.replaceChildren();userMessage();
    status.textContent='等待 10 秒';
    if(mode==='card-first') {
      const node=assistantRow();node.column.append(card(),node.meta);scroll();
      schedule(()=>streamDetails(node,token),WAIT_MS,token);
    } else {
      const waiting=loading();chat.append(waiting);scroll();
      schedule(()=>{
        waiting.remove();const node=assistantRow();node.column.append(details().bubble,card(),node.meta);status.textContent='播放完成';scroll();
      },WAIT_MS,token);
    }
  }
  modeButtons.forEach(button=>button.addEventListener('click',()=>{
    mode=button.dataset.mode;
    modeButtons.forEach(b=>b.setAttribute('aria-pressed',String(b===button)));
    start();
  }));
  $('#replay').addEventListener('click',start);
  start();
})();
</script>
</body>
</html>
