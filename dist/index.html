<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#ffffff">
  <title>阿發－班機延誤理賠</title>
  <style>
    html,body{margin:0;width:100%;height:100%;background:#ececec;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .boot{position:fixed;inset:0;display:grid;place-items:center;color:#666;font-size:14px}
    .boot::before{content:"";width:32px;height:32px;border:3px solid #ddd;border-top-color:#6755d7;border-radius:50%;animation:spin .8s linear infinite;position:absolute;transform:translateY(-28px)}
    @keyframes spin{to{transform:translateY(-28px) rotate(360deg)}}
  </style>
</head>
<body>
  <div class="boot">正在建立 HTML/CSS Prototype…</div>
  <script>
    (async () => {
      const styles = [
        'htmlize.css?v=3',
        'fidelity.css?v=1',
        'icon-overrides.css?v=1',
        'section1-fidelity.css?v=1',
        'section1-runtime.css?v=1',
        'welcome-interactions.css?v=2',
        'section3-fidelity.css?v=2',
        'section5-fidelity.css?v=1',
        'section6-fidelity.css?v=1',
        'section6-batch2.css?v=1',
        'section6-outcomes.css?v=2',
        'section7-fidelity.css?v=1',
        'section8-fidelity.css?v=1',
        'section9-fidelity.css?v=4',
        'library-components.css?v=2',
        'header-link-precision.css?v=5',
        'ui-audit-fixes.css?v=3',
        'section6-date-rebuild.css?v=1',
        'ios-native-ui.css?v=2'
      ];

      const scripts = [
        'htmlize.js?v=3',
        'fidelity.js?v=3',
        'section1-fidelity.js?v=1',
        'section3-fidelity.js?v=3',
        'section5-fidelity.js?v=1',
        'section6-fidelity.js?v=1',
        'section6-batch2.js?v=1',
        'section6-outcomes.js?v=4',
        'section7-fidelity.js?v=1',
        'section8-fidelity.js?v=1',
        'section9-fidelity.js?v=1',
        'section9-outcomes.js?v=1',
        'library-components.js?v=1',
        'section6-date-rebuild.js?v=1'
      ];

      const transparentPixel = 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw==';

      try {
        const response = await fetch('./legacy.html', { cache: 'no-store' });
        if (!response.ok) throw new Error('legacy.html ' + response.status);

        let html = await response.text();

        html = html.replace(/<img\b[^>]*class="[^"]*\bscreen-reference\b[^"]*"[^>]*>/g, (tag) =>
          tag.replace(/\bsrc="[^"]*"/, `src="${transparentPixel}"`)
        );

        const styleTags = styles.map((href) => `<link rel="stylesheet" href="./${href}">`).join('');
        const scriptTags = scripts.map((src) => `<script src="./${src}"><` + '/script>').join('');

        html = html.replace('</head>', `${styleTags}</head>`);
        html = html.replace('</body>', `${scriptTags}</body>`);

        document.open();
        document.write(html);
        document.close();
      } catch (error) {
        document.body.innerHTML = '<main style="padding:24px;max-width:560px;margin:auto"><h1 style="font-size:20px">Prototype 載入失敗</h1><p>請重新整理頁面。</p><pre style="white-space:pre-wrap;color:#a33">' + String(error) + '</pre></main>';
      }
    })();
  </script>
</body>
</html>
